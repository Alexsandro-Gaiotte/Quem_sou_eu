<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow-a" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="angel-group" filter="url(#comic-shadow-a)">
    <!-- Halo Light Rays -->
    <line x1="200" y1="20" x2="200" y2="40" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
    <line x1="140" y1="40" x2="155" y2="55" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />
    <line x1="260" y1="40" x2="245" y2="55" stroke="#FFD700" stroke-width="6" stroke-linecap="round" />

    <!-- Glowing Golden Halo (Floating Ring) -->
    <ellipse cx="200" cy="75" rx="75" ry="24" fill="#FFF176" stroke="#1E1B18" stroke-width="8" />
    <ellipse cx="200" cy="75" rx="55" ry="14" fill="#E1F5FE" stroke="#1E1B18" stroke-width="5" />

    <!-- LEFT WING -->
    <path d="M190,210 
             C160,140 100,100 50,110 
             C40,140 60,180 80,195 
             C50,205 60,240 85,250 
             C65,260 75,290 105,295 
             C120,300 170,270 190,240 Z" 
          fill="#FFFFFF" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Left Wing Feather Texture Details -->
    <path d="M70,160 C100,175 140,195 180,215" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" />
    <path d="M80,225 C110,235 150,245 185,240" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" />

    <!-- RIGHT WING -->
    <path d="M210,210 
             C240,140 300,100 350,110 
             C360,140 340,180 320,195 
             C350,205 340,240 315,250 
             C335,260 325,290 295,295 
             C280,300 230,270 210,240 Z" 
          fill="#FFFFFF" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Right Wing Feather Texture Details -->
    <path d="M330,160 C300,175 260,195 220,215" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" />
    <path d="M320,225 C290,235 250,245 215,240" fill="none" stroke="#E0E0E0" stroke-width="5" stroke-linecap="round" />

    <!-- Soft Cloud Center -->
    <path d="M140,290 
             C120,290 110,260 130,245 
             C120,220 150,200 175,215 
             C190,195 220,195 235,215 
             C260,200 290,220 280,245 
             C300,260 290,290 270,290 
             C260,320 150,320 140,290 Z" 
          fill="#E1F5FE" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Smiling cute cloud face -->
    <circle cx="180" cy="255" r="5" fill="#1E1B18" />
    <circle cx="220" cy="255" r="5" fill="#1E1B18" />
    <path d="M192,268 Q200,276 208,268" fill="none" stroke="#1E1B18" stroke-width="4" stroke-linecap="round" />
    <circle cx="168" cy="262" r="7" fill="#FF80AB" opacity="0.6" />
    <circle cx="232" cy="262" r="7" fill="#FF80AB" opacity="0.6" />

    <!-- Golden Sparkles -->
    <polygon points="90,70 94,82 106,85 94,88 90,100 86,88 74,85 86,82" fill="#FFD700" stroke="#1E1B18" stroke-width="2.5" />
    <polygon points="310,70 314,82 326,85 314,88 310,100 306,88 294,85 306,82" fill="#FFD700" stroke="#1E1B18" stroke-width="2.5" />
  </g>
</svg>