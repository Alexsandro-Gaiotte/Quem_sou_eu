<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow-o" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="onion-group" filter="url(#comic-shadow-o)">
    <!-- THE ICONIC 5 GREEN HAIR SPROUTS (Cebolinha reference) -->
    <!-- Sprout 1 (far left) -->
    <path d="M165,145 C150,110 130,80 110,65 C130,75 160,115 170,145 Z" fill="#43A047" stroke="#1E1B18" stroke-width="7" stroke-linejoin="round" />
    <!-- Sprout 2 (mid left) -->
    <path d="M180,140 C175,90 160,50 150,30 C170,45 185,90 188,140 Z" fill="#4CAF50" stroke="#1E1B18" stroke-width="7" stroke-linejoin="round" />
    <!-- Sprout 3 (center tall) -->
    <path d="M194,135 C195,80 200,30 200,15 C205,30 208,80 206,135 Z" fill="#66BB6A" stroke="#1E1B18" stroke-width="7" stroke-linejoin="round" />
    <!-- Sprout 4 (mid right) -->
    <path d="M212,140 C215,90 230,50 245,30 C235,50 222,95 218,140 Z" fill="#4CAF50" stroke="#1E1B18" stroke-width="7" stroke-linejoin="round" />
    <!-- Sprout 5 (far right) -->
    <path d="M228,145 C240,110 265,80 285,65 C265,75 238,115 230,145 Z" fill="#43A047" stroke="#1E1B18" stroke-width="7" stroke-linejoin="round" />

    <!-- Root hairs at bottom -->
    <path d="M190,340 C185,360 175,370 170,380" fill="none" stroke="#8D6E63" stroke-width="5" stroke-linecap="round" />
    <path d="M200,340 C200,365 200,375 200,385" fill="none" stroke="#8D6E63" stroke-width="5" stroke-linecap="round" />
    <path d="M210,340 C215,360 225,370 230,380" fill="none" stroke="#8D6E63" stroke-width="5" stroke-linecap="round" />

    <!-- Onion Bulb Main Body -->
    <ellipse cx="200" cy="245" rx="105" ry="100" fill="#E8F5E9" stroke="#1E1B18" stroke-width="9" />

    <!-- Onion Outer Peel Curves -->
    <path d="M150,155 C115,190 115,290 155,335" fill="none" stroke="#A5D6A7" stroke-width="8" stroke-linecap="round" />
    <path d="M250,155 C285,190 285,290 245,335" fill="none" stroke="#A5D6A7" stroke-width="8" stroke-linecap="round" />
    <path d="M175,148 C155,185 155,295 180,340" fill="none" stroke="#C8E6C9" stroke-width="6" stroke-linecap="round" />
    <path d="M225,148 C245,185 245,295 220,340" fill="none" stroke="#C8E6C9" stroke-width="6" stroke-linecap="round" />

    <!-- Cheeky Winking Eyes -->
    <!-- Left Eye (Open and mischievous) -->
    <ellipse cx="165" cy="225" rx="14" ry="16" fill="#1E1B18" />
    <circle cx="162" cy="220" r="5" fill="#FFFFFF" />
    <path d="M148,205 C158,198 178,202 182,210" fill="none" stroke="#1E1B18" stroke-width="5" stroke-linecap="round" />

    <!-- Right Eye (Playful Wink) -->
    <path d="M220,230 Q235,215 250,230" fill="none" stroke="#1E1B18" stroke-width="7" stroke-linecap="round" />
    <path d="M218,205 C228,198 248,202 252,210" fill="none" stroke="#1E1B18" stroke-width="5" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="135" cy="255" r="14" fill="#FF80AB" opacity="0.6" />
    <circle cx="265" cy="255" r="14" fill="#FF80AB" opacity="0.6" />

    <!-- Smug / Sly Comic Smile -->
    <path d="M175,260 Q195,295 235,265" fill="none" stroke="#1E1B18" stroke-width="7" stroke-linecap="round" />
    <line x1="235" y1="262" x2="242" y2="272" stroke="#1E1B18" stroke-width="6" stroke-linecap="round" />

    <!-- Idea Lightbulb spark -->
    <polygon points="310,120 314,130 324,133 314,136 310,146 306,136 296,133 306,130" fill="#FFD700" stroke="#1E1B18" stroke-width="3" />
  </g>
</svg>