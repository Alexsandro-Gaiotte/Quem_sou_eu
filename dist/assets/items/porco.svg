<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow-p" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="pig-group" filter="url(#comic-shadow-p)">
    <!-- Curly Spiral Tail -->
    <path d="M90,260 C70,250 60,220 80,210 C100,200 110,230 90,240 C80,245 75,235 85,230" fill="none" stroke="#1E1B18" stroke-width="8" stroke-linecap="round" />
    <path d="M90,260 C70,250 60,220 80,210 C100,200 110,230 90,240 C80,245 75,235 85,230" fill="none" stroke="#FF80AB" stroke-width="4" stroke-linecap="round" />

    <!-- Left Floppy Ear -->
    <polygon points="120,130 145,50 185,110" fill="#FF80AB" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />
    <polygon points="130,125 150,70 175,110" fill="#F48FB1" stroke="#1E1B18" stroke-width="4" />

    <!-- Right Floppy Ear -->
    <polygon points="280,130 255,50 215,110" fill="#FF80AB" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />
    <polygon points="270,125 250,70 225,110" fill="#F48FB1" stroke="#1E1B18" stroke-width="4" />

    <!-- Chubby Pig Body -->
    <ellipse cx="200" cy="250" rx="110" ry="90" fill="#FF80AB" stroke="#1E1B18" stroke-width="8" />

    <!-- Mud Patches on Body (Chovinista reference) -->
    <path d="M120,240 C110,220 130,200 150,210 C170,220 160,250 140,260 Z" fill="#8D6E63" stroke="#1E1B18" stroke-width="4" />
    <path d="M250,280 C240,260 270,250 280,270 C290,290 270,300 250,280 Z" fill="#8D6E63" stroke="#1E1B18" stroke-width="4" />

    <!-- Trotters / Feet -->
    <rect x="140" y="310" width="35" height="45" rx="12" fill="#F06292" stroke="#1E1B18" stroke-width="7" />
    <rect x="225" y="310" width="35" height="45" rx="12" fill="#F06292" stroke="#1E1B18" stroke-width="7" />
    <!-- Hooves splits -->
    <line x1="157" y1="335" x2="157" y2="355" stroke="#1E1B18" stroke-width="5" />
    <line x1="242" y1="335" x2="242" y2="355" stroke="#1E1B18" stroke-width="5" />

    <!-- Head -->
    <circle cx="200" cy="170" r="75" fill="#FF80AB" stroke="#1E1B18" stroke-width="8" />

    <!-- Cute Eyes -->
    <ellipse cx="165" cy="155" rx="12" ry="14" fill="#1E1B18" />
    <circle cx="162" cy="150" r="4" fill="#FFFFFF" />

    <ellipse cx="235" cy="155" rx="12" ry="14" fill="#1E1B18" />
    <circle cx="232" cy="150" r="4" fill="#FFFFFF" />

    <!-- Mud splat on forehead -->
    <path d="M190,110 C180,105 195,95 210,100 C220,105 210,115 190,110 Z" fill="#8D6E63" />

    <!-- Big Oval Snout -->
    <ellipse cx="200" cy="195" rx="36" ry="26" fill="#F06292" stroke="#1E1B18" stroke-width="7" />
    <!-- Nostrils -->
    <ellipse cx="188" cy="195" rx="7" ry="11" fill="#1E1B18" />
    <ellipse cx="212" cy="195" rx="7" ry="11" fill="#1E1B18" />

    <!-- Rosy Cheek Blushes -->
    <circle cx="140" cy="190" r="14" fill="#FF4081" opacity="0.6" />
    <circle cx="260" cy="190" r="14" fill="#FF4081" opacity="0.6" />

    <!-- Smiling Mouth below snout -->
    <path d="M185,228 Q200,242 215,228" fill="none" stroke="#1E1B18" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>