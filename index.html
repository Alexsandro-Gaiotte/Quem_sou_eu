<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quem Sou Eu? - Animais &amp; Objetos</title>
  <meta name="description" content="Jogo interativo e animado de Quem Sou Eu com Animais e Objetos. Adivinhe pela silhueta no Modo Sombra e descubra pistas divertidas cheias de referências indiretas!" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>" />
</head>
<body>
  <div class="comic-app-container">
    <!-- Header with Title and HUD -->
    <header class="comic-header">
      <div class="comic-title-badge">
        <span>🐾</span>
        <h1>QUEM SOU EU?</h1>
      </div>
      <div class="hud-badges">
        <div class="hud-badge score-badge" title="Pontuação">
          ⭐ <span id="hud-score">0</span>
        </div>
        <div class="hud-badge streak-badge" id="hud-streak" title="Multiplicador de Combo">
          Combo x1
        </div>
        <button id="shadow-mode-toggle-btn" class="hud-badge shadow-toggle-btn" title="Alternar Modo Sombra" aria-label="Alternar Modo Sombra">
          👤 Sombra: <b>ON</b>
        </button>
        <button id="sound-toggle-btn" class="icon-btn" title="Ligar/Desligar Som" aria-label="Ligar ou desligar som">
          🔊
        </button>
        <button id="fullscreen-toggle-btn" class="icon-btn" title="Tela Cheia (Lousa Digital / TV)" aria-label="Alternar Tela Cheia">
          ⛶
        </button>
      </div>
    </header>

    <!-- Main Game Body: Adaptable to 20" - 80" Large Screens -->
    <main class="comic-game-body">
      <!-- Stage Column (Character Stage & Silhouette) -->
      <div class="stage-column">
        <section class="character-stage-wrapper" aria-label="Palco do Item">
          <div class="character-comic-portal" id="character-portal" title="Clique no item!">
            <div id="phaser-character-canvas"></div>
          </div>
          <div class="stage-badge" id="stage-badge">👤 MODO SOMBRA</div>
        </section>
      </div>

      <!-- Interaction Column (Speech Bubble Clue, Answer Cards, Controls) -->
      <div class="interaction-column">
        <!-- Item Clue (Middle: Comic Speech Bubble) -->
        <section class="speech-bubble-wrapper" aria-label="Dica do Item">
          <div class="speech-bubble">
            <span class="clue-label">DICA MISTERIOSA</span>
            <p class="clue-text" id="character-clue-text">Carregando pista...</p>
          </div>
        </section>

        <!-- Item Selection Cards -->
        <section class="selection-section" aria-label="Opções de Resposta">
          <div class="selection-prompt">
            <span class="prompt-tag">QUEM SOU EU? ESCOLHA A RESPOSTA!</span>
          </div>
          <div class="cards-grid" id="cards-grid">
            <!-- Interactive Cards injected dynamically -->
          </div>
        </section>

        <!-- Footer Controls -->
        <footer class="comic-footer-actions">
          <button class="hint-btn" id="hint-btn" title="Ver outra pista sobre o item">
            💡 Outra Dica
          </button>
          <div class="round-tracker">
            Rodada: <span id="hud-round">1 / 8</span>
          </div>
        </footer>
      </div>
    </main>
  </div>

  <!-- Victory / Game Complete Modal -->
  <div class="comic-modal-overlay" id="game-modal" style="display: none;" role="dialog" aria-modal="true">
    <div class="comic-modal-content">
      <div class="modal-trophy">🏆</div>
      <h2 class="modal-title" id="modal-title">Parabéns!</h2>
      <p class="modal-subtitle" id="modal-title-badge">Mestre Supremo dos Enigmas!</p>
      
      <div class="modal-stats">
        <div class="stat-item">
          <span class="stat-val" id="modal-final-score">0</span>
          <span class="stat-label">Pontuação</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="modal-best-streak">x1</span>
          <span class="stat-label">Maior Combo</span>
        </div>
      </div>

      <button class="modal-btn" id="modal-restart-btn">
        JOGAR NOVAMENTE 🔄
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
