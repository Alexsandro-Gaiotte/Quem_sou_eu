<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow-d" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="dog-group" filter="url(#comic-shadow-d)">
    <!-- Wagging Tail -->
    <path d="M110,290 C80,270 70,220 90,200 C98,190 110,200 105,215 C95,235 105,265 125,280 Z" fill="#1E88E5" stroke="#1E1B18" stroke-width="7" />
    <!-- Motion lines near tail -->
    <path d="M75,185 C85,180 90,175 92,165" fill="none" stroke="#1E1B18" stroke-width="4" stroke-linecap="round" />
    <path d="M60,205 C70,200 75,195 78,185" fill="none" stroke="#1E1B18" stroke-width="4" stroke-linecap="round" />

    <!-- Left floppy ear -->
    <path d="M150,110 C120,110 100,160 115,195 C125,215 145,215 150,185 Z" fill="#1565C0" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Hind Leg / Sitting Thigh -->
    <ellipse cx="140" cy="300" rx="45" ry="35" fill="#1E88E5" stroke="#1E1B18" stroke-width="8" />
    <ellipse cx="130" cy="335" rx="30" ry="16" fill="#1565C0" stroke="#1E1B18" stroke-width="7" />

    <!-- Dog Body -->
    <path d="M150,220 C140,290 180,330 250,330 C270,330 270,290 260,240 C250,190 170,170 150,220 Z" fill="#2196F3" stroke="#1E1B18" stroke-width="8" />

    <!-- Front Legs -->
    <rect x="210" y="270" width="28" height="70" rx="14" fill="#1E88E5" stroke="#1E1B18" stroke-width="7" />
    <rect x="245" y="270" width="28" height="70" rx="14" fill="#1E88E5" stroke="#1E1B18" stroke-width="7" />
    <!-- Paws -->
    <ellipse cx="224" cy="342" rx="18" ry="12" fill="#1565C0" stroke="#1E1B18" stroke-width="6" />
    <ellipse cx="259" cy="342" rx="18" ry="12" fill="#1565C0" stroke="#1E1B18" stroke-width="6" />

    <!-- Right floppy ear -->
    <path d="M260,110 C290,110 310,160 295,195 C285,215 265,215 260,185 Z" fill="#1565C0" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Head -->
    <circle cx="210" cy="155" r="65" fill="#2196F3" stroke="#1E1B18" stroke-width="8" />

    <!-- Shaggy Schnauzer Eyebrows -->
    <path d="M165,130 C175,115 195,120 190,140 Z" fill="#1565C0" stroke="#1E1B18" stroke-width="5" />
    <path d="M255,130 C245,115 225,120 230,140 Z" fill="#1565C0" stroke="#1E1B18" stroke-width="5" />

    <!-- Eyes (Expressive, looking thoughtful) -->
    <circle cx="180" cy="148" r="12" fill="#FFFFFF" stroke="#1E1B18" stroke-width="4" />
    <circle cx="182" cy="147" r="7" fill="#1E1B18" />
    <circle cx="180" cy="144" r="2.5" fill="#FFFFFF" />

    <circle cx="240" cy="148" r="12" fill="#FFFFFF" stroke="#1E1B18" stroke-width="4" />
    <circle cx="238" cy="147" r="7" fill="#1E1B18" />
    <circle cx="236" cy="144" r="2.5" fill="#FFFFFF" />

    <!-- Snout & Schnauzer Beard / Mustache -->
    <path d="M180,165 C150,195 160,225 210,225 C260,225 270,195 240,165 Z" fill="#BBDEFB" stroke="#1E1B18" stroke-width="7" />

    <!-- Big shiny dark nose -->
    <ellipse cx="210" cy="178" rx="16" ry="12" fill="#1E1B18" />
    <ellipse cx="206" cy="174" rx="5" ry="3" fill="#FFFFFF" />

    <!-- Happy tongue / mouth -->
    <path d="M200,200 Q210,215 220,200" fill="none" stroke="#1E1B18" stroke-width="5" stroke-linecap="round" />
    <path d="M205,206 Q210,222 215,206 Z" fill="#FF5252" stroke="#1E1B18" stroke-width="3" />
  </g>
</svg>
