<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="rabbit-group" filter="url(#comic-shadow)">
    <!-- Back / Tail -->
    <circle cx="120" cy="300" r="28" fill="#64B5F6" stroke="#1E1B18" stroke-width="8" />

    <!-- Left Ear (Long, upright) -->
    <path d="M140,160 C120,80 120,20 155,20 C185,20 180,90 170,160 Z" fill="#29B6F6" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />
    <path d="M145,140 C135,80 135,40 155,38 C172,38 170,90 162,140 Z" fill="#F48FB1" stroke="#1E1B18" stroke-width="5" />

    <!-- Right Ear (Iconic floppy / slightly knotted ear) -->
    <path d="M230,160 C250,90 280,40 260,30 C240,20 220,70 200,150 Z" fill="#29B6F6" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />
    <path d="M225,140 C245,85 265,50 255,42 C242,35 225,80 210,135 Z" fill="#F48FB1" stroke="#1E1B18" stroke-width="5" />

    <!-- Knot on the right ear -->
    <ellipse cx="235" cy="85" rx="18" ry="12" fill="#0288D1" stroke="#1E1B18" stroke-width="6" transform="rotate(-20 235 85)" />

    <!-- Feet -->
    <ellipse cx="145" cy="340" rx="36" ry="22" fill="#0288D1" stroke="#1E1B18" stroke-width="8" />
    <ellipse cx="255" cy="340" rx="36" ry="22" fill="#0288D1" stroke="#1E1B18" stroke-width="8" />
    <!-- Foot pads -->
    <ellipse cx="145" cy="340" rx="20" ry="12" fill="#E1F5FE" />
    <ellipse cx="255" cy="340" rx="20" ry="12" fill="#E1F5FE" />

    <!-- Plush Body -->
    <ellipse cx="200" cy="270" rx="85" ry="75" fill="#29B6F6" stroke="#1E1B18" stroke-width="8" />
    <!-- Plush Belly -->
    <ellipse cx="200" cy="275" rx="55" ry="48" fill="#E1F5FE" stroke="#1E1B18" stroke-width="6" />

    <!-- Paws -->
    <ellipse cx="130" cy="250" rx="24" ry="18" fill="#0288D1" stroke="#1E1B18" stroke-width="7" transform="rotate(-15 130 250)" />
    <ellipse cx="270" cy="250" rx="24" ry="18" fill="#0288D1" stroke="#1E1B18" stroke-width="7" transform="rotate(15 270 250)" />

    <!-- Head -->
    <circle cx="200" cy="180" r="75" fill="#29B6F6" stroke="#1E1B18" stroke-width="8" />

    <!-- Rosy Cheeks -->
    <ellipse cx="150" cy="205" rx="16" ry="10" fill="#FF80AB" opacity="0.8" />
    <ellipse cx="250" cy="205" rx="16" ry="10" fill="#FF80AB" opacity="0.8" />

    <!-- Plush Eyes (Button eyes) -->
    <circle cx="165" cy="170" r="14" fill="#1E1B18" />
    <circle cx="162" cy="166" r="4" fill="#FFFFFF" />
    <circle cx="235" cy="170" r="14" fill="#1E1B18" />
    <circle cx="232" cy="166" r="4" fill="#FFFFFF" />

    <!-- Nose -->
    <polygon points="200,188 188,178 212,178" fill="#F48FB1" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round" />

    <!-- Mouth & Dentes Fofos -->
    <path d="M190,195 Q200,205 210,195" fill="none" stroke="#1E1B18" stroke-width="6" stroke-linecap="round" />
    <rect x="194" y="196" width="12" height="12" rx="3" fill="#FFFFFF" stroke="#1E1B18" stroke-width="4" />

    <!-- Stitches -->
    <line x1="200" y1="110" x2="200" y2="135" stroke="#0288D1" stroke-width="4" stroke-dasharray="4,4" />
  </g>
</svg>
