<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="comic-shadow-e" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#1E1B18" flood-opacity="0.9" />
    </filter>
  </defs>

  <g id="elephant-group" filter="url(#comic-shadow-e)">
    <!-- Elephant Tail with hairy tuft -->
    <path d="M100,260 C75,270 70,300 78,320" fill="none" stroke="#1E1B18" stroke-width="6" stroke-linecap="round" />
    <path d="M72,315 C65,325 80,335 88,325 Z" fill="#2E7D32" stroke="#1E1B18" stroke-width="4" />

    <!-- Big Round Back Ear (Left) -->
    <ellipse cx="120" cy="170" rx="50" ry="60" fill="#43A047" stroke="#1E1B18" stroke-width="8" transform="rotate(-15 120 170)" />
    <ellipse cx="120" cy="170" rx="35" ry="42" fill="#81C784" stroke="#1E1B18" stroke-width="4" transform="rotate(-15 120 170)" />

    <!-- Big Elephant Body -->
    <ellipse cx="190" cy="250" rx="100" ry="85" fill="#4CAF50" stroke="#1E1B18" stroke-width="8" />

    <!-- Thick Legs -->
    <rect x="120" y="280" width="45" height="75" rx="15" fill="#388E3C" stroke="#1E1B18" stroke-width="7" />
    <rect x="200" y="280" width="45" height="75" rx="15" fill="#388E3C" stroke="#1E1B18" stroke-width="7" />
    <!-- Toenails -->
    <circle cx="132" cy="350" r="7" fill="#E8F5E9" stroke="#1E1B18" stroke-width="3" />
    <circle cx="147" cy="352" r="7" fill="#E8F5E9" stroke="#1E1B18" stroke-width="3" />
    <circle cx="212" cy="350" r="7" fill="#E8F5E9" stroke="#1E1B18" stroke-width="3" />
    <circle cx="227" cy="352" r="7" fill="#E8F5E9" stroke="#1E1B18" stroke-width="3" />

    <!-- Big Head -->
    <circle cx="225" cy="175" r="70" fill="#4CAF50" stroke="#1E1B18" stroke-width="8" />

    <!-- Big Front Ear (Right) -->
    <ellipse cx="280" cy="170" rx="55" ry="65" fill="#43A047" stroke="#1E1B18" stroke-width="8" transform="rotate(15 280 170)" />
    <ellipse cx="280" cy="170" rx="38" ry="45" fill="#81C784" stroke="#1E1B18" stroke-width="4" transform="rotate(15 280 170)" />

    <!-- Eyes -->
    <ellipse cx="205" cy="155" rx="12" ry="15" fill="#FFFFFF" stroke="#1E1B18" stroke-width="4" />
    <circle cx="208" cy="155" r="7" fill="#1E1B18" />
    <circle cx="205" cy="151" r="2.5" fill="#FFFFFF" />

    <!-- Trunk curled cheerfully upwards (Iconic silhouette!) -->
    <path d="M220,195 
             C210,240 260,260 270,220 
             C280,180 320,150 330,120 
             C335,100 310,95 305,115 
             C295,140 260,170 250,195 Z" 
          fill="#4CAF50" stroke="#1E1B18" stroke-width="8" stroke-linejoin="round" />

    <!-- Trunk wrinkle creases -->
    <line x1="230" y1="215" x2="245" y2="218" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" />
    <line x1="245" y1="230" x2="260" y2="225" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" />
    <line x1="275" y1="185" x2="288" y2="175" stroke="#2E7D32" stroke-width="4" stroke-linecap="round" />

    <!-- Little Cute Ivory Tusk -->
    <path d="M205,205 C185,215 175,245 190,250 C200,250 205,230 215,210 Z" fill="#FFFDE7" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round" />

    <!-- Rosy Cheek -->
    <circle cx="180" cy="180" r="14" fill="#FF80AB" opacity="0.6" />
  </g>
</svg>
